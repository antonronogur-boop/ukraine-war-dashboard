name: Heti Oryx adatfrissítés

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Kényszer futtatás'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: data/ könyvtár ellenőrzése
        run: mkdir -p data

      - name: RUS scraping (Oryx)
        run: python scripts/scraper_RUS.py data/xyz_RUS.xlsx

      - name: UKR scraping (Oryx)
        run: python scripts/scraper_UKR.py data/xyz_UKR.xlsx

      - name: Delta kalkuláció — RUS
        run: python scripts/analysis_losses.py data/xyz_RUS.xlsx

      - name: Delta kalkuláció — UKR
        run: python scripts/analysis_losses.py data/xyz_UKR.xlsx

      - name: C_SUM generálás — RUS
        run: python scripts/collector.py data/xyz_RUS.xlsx

      - name: C_SUM generálás — UKR
        run: python scripts/collector.py data/xyz_UKR.xlsx

      - name: JSON export
        run: python oryx_export.py

      - name: Commit és push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update: Oryx heti adatfrissítés'
          file_pattern: 'data/xyz_RUS.xlsx data/xyz_UKR.xlsx oryx_data.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
