name: Heti Oryx adatfrissítés

on:
  # Minden kedden 07:00 UTC (= 09:00 Budapest nyáron)
  schedule:
    - cron: '0 7 * * 2'

  # Manuálisan is indítható a GitHub Actions fülön
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Kényszer futtatás (akkor is fut ha ma már volt scraping)'
        required: false
        default: 'false'

# Szükséges hogy vissza tudjon írni a repóba
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: data/ könyvtár ellenőrzése
        run: mkdir -p data

      - name: RUS scraping (Oryx)
        run: python scripts/scraper_RUS.py data/xyz_RUS.xlsx
        continue-on-error: false

      - name: UKR scraping (Oryx)
        run: python scripts/scraper_UKR.py data/xyz_UKR.xlsx
        continue-on-error: false

      - name: Delta kalkuláció — RUS
        run: python scripts/analysis_losses.py data/xyz_RUS.xlsx

      - name: Delta kalkuláció — UKR
        run: python scripts/analysis_losses.py data/xyz_UKR.xlsx

      - name: C_SUM generálás — RUS
        run: python scripts/collector.py data/xyz_RUS.xlsx

      - name: C_SUM generálás — UKR
        run: python scripts/collector.py data/xyz_UKR.xlsx

      - name: JSON export (oryx_data.json)
        run: python oryx_export.py

      - name: Legfrissebb változások beolvasztása (divergált ág megelőzése)
        run: git pull --rebase origin main

      - name: Változások commitolása és pusholása
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Auto-update: Oryx heti adatfrissítés (${{ github.run_id }})

            Futás ideje: ${{ github.event.repository.updated_at }}
          file_pattern: 'data/xyz_RUS.xlsx data/xyz_UKR.xlsx oryx_data.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
