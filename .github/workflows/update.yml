name: Heti Oryx adatfrissítés

on:
  # 12:07 UTC = ~09:07 Budapest nyáron (kedd)
  # A kerek óra (:00) kerülése csökkenti a GitHub Actions torlódás kockázatát
  schedule:
    - cron: '12 7 * * 2'

  workflow_dispatch:
    inputs:
      force_run:
        description: 'Kényszer futtatás (akkor is fut ha ma már volt scraping)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write   # GitHub Issue nyitáshoz hiba esetén

# Megakadályozza, hogy a napi és heti workflow egyszerre fusson
# és push-ütközést okozzanak egymásnak
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Legfrissebb változások beolvasztása
        run: git pull --rebase origin main

      - name: Python 3.11 telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: data/ könyvtár ellenőrzése
        run: mkdir -p data

      - name: RUS scraping (Oryx)
        id: scrape_rus
        run: python scripts/scraper_RUS.py data/xyz_RUS.xlsx
        continue-on-error: false

      - name: UKR scraping (Oryx)
        id: scrape_ukr
        run: python scripts/scraper_UKR.py data/xyz_UKR.xlsx
        continue-on-error: false

      - name: Delta kalkuláció — RUS
        run: python scripts/analysis_losses.py data/xyz_RUS.xlsx

      - name: Delta kalkuláció — UKR
        run: python scripts/analysis_losses.py data/xyz_UKR.xlsx

      - name: C_SUM generálás — RUS
        run: python scripts/collector.py data/xyz_RUS.xlsx

      - name: C_SUM generálás — UKR
        run: python scripts/collector.py data/xyz_UKR.xlsx

      - name: JSON export (oryx_data.json)
        run: python oryx_export.py

      - name: Változások commitolása és pusholása
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Auto-update: Oryx heti adatfrissítés (${{ github.run_id }})
          file_pattern: 'data/xyz_RUS.xlsx data/xyz_UKR.xlsx oryx_data.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push retry ha ütközés volt
        if: failure() && steps.commit.outcome == 'failure'
        run: |
          echo "Push ütközés — rebase és újrapróbálkozás..."
          git pull --rebase origin main
          git push origin main

      - name: GitHub Issue nyitása hiba esetén
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Oryx heti frissítés SIKERTELEN — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Automatikus hibajelzés',
              '',
              `**Futás:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              `**Dátum:** ${new Date().toISOString()}`,
              '',
              '### Mit kell ellenőrizni',
              '1. A fenti futás logját — melyik lépés bukott el?',
              '2. Az Oryx oldalak elérhetőségét (scraper_RUS.py / scraper_UKR.py)',
              '3. Push ütközés esetén: volt-e kézi feltöltés a workflow futása közben?',
              '',
              '*Ez az issue automatikusan lett létrehozva a GitHub Actions workflow által.*',
            ].join('\n');

            // Ellenőrzés: van-e már nyitott issue ugyanerről
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-error',
            });

            const alreadyOpen = issues.data.some(i => i.title.includes('Oryx heti frissítés SIKERTELEN'));
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['auto-error'],
              });
            }
