name: Heti Oryx adatfrissítés

on:
  # Minden kedden 07:00 UTC (= 09:00 Budapest nyáron)
  schedule:
    - cron: '0 7 * * 2'

  # Manuálisan is indítható a GitHub Actions fülön
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Kényszer futtatás (akkor is fut ha ma már volt scraping)'
        required: false
        default: 'false'

# Szükséges hogy vissza tudjon írni a repóba
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Legfrissebb változások beolvasztása (divergált ág megelőzése)
        run: git pull --rebase origin main

      - name: Python 3.11 telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: data/ könyvtár ellenőrzése
        run: mkdir -p data

      # Az Oryx Blogspoton fut, tehat Google-infrastrukturan. A 2026-08-04-i
      # futasban a ket lekeres szunet nelkul ment egymas utan ugyanarrol az
      # IP-rol: az orosz sikerult (9 mp), az ukran egy masodperccel kesobb
      # 429-et kapott, es ezzel az EGESZ heti frissites elszallt — beleertve a
      # mar lehuzott orosz adatot is.
      - name: RUS scraping (Oryx)
        run: python scripts/scraper_RUS.py data/xyz_RUS.xlsx

      # Szunet a ket lekeres kozott. Heti egyszeri futasnal 30 masodperc
      # elhanyagolhato koltseg; ennek hianya viszont pontosan az, ami a
      # masodik kerest a botvedelembe futtatta.
      - name: Varakozas a kovetkezo lekeres elott
        run: sleep 30

      # continue-on-error: ha az ukran oldal ma nem elerheto, az OROSZ adat
      # akkor is menjen at a feldolgozason es a commitba. Fel adat tobb, mint
      # semmi — a hianyt a lenti ellenorzo lepes teszi lathatova.
      - name: UKR scraping (Oryx)
        id: ukr
        continue-on-error: true
        run: python scripts/scraper_UKR.py data/xyz_UKR.xlsx

      # HANGOS JELZES. A futas ettol meg zold marad (az orosz adat frissult),
      # de a naploban es a job-osszegzoben ott all, hogy az ukran oldal
      # kimaradt — kulonben a felezett frissites ugyanugy nezne ki, mint egy
      # teljes.
      - name: Ukran lekeres allapotanak jelzese
        if: steps.ukr.outcome == 'failure'
        run: |
          echo "::warning::Az UKRAN Oryx lekeres nem sikerult — az orosz adat frissult, az ukran NEM. A kovetkezo heti futas ujraprobalja."
          echo "### ⚠ Az ukran Oryx adat NEM frissult ebben a futasban" >> $GITHUB_STEP_SUMMARY
          echo "Az orosz adat rendben frissult. Az ukran oldal lekerese tobb ujraprobalkozas utan sem sikerult (jellemzoen Google rate limit)." >> $GITHUB_STEP_SUMMARY

      - name: Delta kalkuláció — RUS
        run: python scripts/analysis_losses.py data/xyz_RUS.xlsx

      - name: Delta kalkuláció — UKR
        run: python scripts/analysis_losses.py data/xyz_UKR.xlsx

      - name: C_SUM generálás — RUS
        run: python scripts/collector.py data/xyz_RUS.xlsx

      - name: C_SUM generálás — UKR
        run: python scripts/collector.py data/xyz_UKR.xlsx

      - name: JSON export (oryx_data.json)
        run: python oryx_export.py

      - name: Változások commitolása és pusholása
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Auto-update: Oryx heti adatfrissítés (${{ github.run_id }})

            Futás ideje: ${{ github.event.repository.updated_at }}
          file_pattern: 'data/xyz_RUS.xlsx data/xyz_UKR.xlsx oryx_data.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
